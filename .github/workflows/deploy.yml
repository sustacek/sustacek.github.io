# Builds the Docusaurus site with pnpm and publishes it to the `gh-pages` branch.
#
# - Pull requests: build only (verifies that the site compiles, nothing is published).
# - Push to `main` / manual run: build and deploy.
#
# NOTE: In the repository settings, Pages -> Build and deployment -> Source must be
# "Deploy from a branch" with branch `gh-pages` and folder `/ (root)`.
name: Build and deploy to gh-pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# peaceiris/actions-gh-pages pushes to the gh-pages branch using GITHUB_TOKEN
permissions:
  contents: write

# Only one deployment at a time; never cancel a deployment that is already running
concurrency:
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version is taken from the "packageManager" field in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node version is taken from .nvmrc
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy to gh-pages branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # the custom domain is kept by static/CNAME, which Docusaurus copies into ./build
          force_orphan: true
