# Builds the Docusaurus site with pnpm and deploys it to GitHub Pages.
#
# - Pull requests: build only (verifies that the site compiles, nothing is published).
# - Push to `main` / manual run: build, then deploy.
#
# All actions are pinned to full commit SHAs (the tag is in the trailing comment).
#
# NOTE: In the repository settings, Pages -> Build and deployment -> Source must be
# "GitHub Actions". The custom domain is configured there as well.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Only one deployment at a time; never cancel a deployment that is already running
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version is taken from the "packageManager" field in package.json.
      # pnpm/setup is the successor of pnpm/action-setup for pnpm 11 and newer.
      # It installs dependencies by default; that is done explicitly below instead.
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false

      # Node version is taken from .nvmrc
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      # The old Jekyll site published its (Atom) feed at /feed.xml. A redirect cannot work for
      # feed readers, so serve the Docusaurus feed at the old location too.
      - name: Keep old /feed.xml URL
        run: cp build/blog/atom.xml build/feed.xml

      # Fail the build if the old-URL redirect pages were not generated
      - name: Verify legacy URLs
        run: |
          test -s build/feed.xml
          test -s build/files/resume/Josef-Sustacek-CV-20240708.pdf
          # files must be linked by their stable /files/... URL, not as hashed /assets/files/... copies
          if grep -rl 'assets/files/' build --include='*.html'; then
            echo "::error::Pages link to hashed /assets/files/ copies, use pathname:/// links"
            exit 1
          fi
          test -n "$(find build -name '2013-01-opends-testing-ldap-server*' -print -quit)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
